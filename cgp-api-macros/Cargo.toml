[package]
name = "cgp-api-macros"
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
description = "Proc-macro attribute #[entity_api] for generating cgp-api context wiring"
keywords = ["cgp", "sea-orm", "repository", "api", "macros"]
categories = ["database", "rust-patterns"]
readme = "README.md"
documentation = "https://docs.rs/cgp-api-macros"
repository = "https://github.com/Just-Replicant/cgp-api"
include = ["src/**/*", "Cargo.toml", "README.md"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }

[dev-dependencies]
trybuild = "1"
